name: Search for web fluid formulas
on:
  workflow_dispatch:          # Run it from the Actions tab
  schedule:
    - cron: "0 6 * * *"       # Daily at 06:00 UTC; delete these two lines to run manually only
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node search.js --max-minutes 15 --patience 100000
      - name: Commit results
        run: |
          git config user.name "formula-bot"
          git config user.email "formula-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Update formula search results"
          git push
